name: Lenovo Outlet Refurb Catalog (Every 30 Minutes)

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel workers'
        required: false
        default: '4'
      commit_changes:
        description: 'Commit and push changes'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: refurb-data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refurb-catalog:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'
      TARGET_REPO_OWNER: ${{ secrets.TARGET_REPO_OWNER || 'kryptobolt07' }}
      TARGET_REPO_NAME: ${{ secrets.TARGET_REPO_NAME || 'laptopdeals' }}
      TARGET_REPO_BRANCH: ${{ secrets.TARGET_REPO_BRANCH || 'main' }}
      TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
      WORKERS: ${{ github.event.inputs.workers || '4' }}
      COMMIT_CHANGES: ${{ github.event_name == 'schedule' && 'true' || inputs.commit_changes }}
      GIT_COMMIT_AUTHOR_NAME: ${{ secrets.GIT_COMMIT_AUTHOR_NAME || 'github-actions[bot]' }}
      GIT_COMMIT_AUTHOR_EMAIL: ${{ secrets.GIT_COMMIT_AUTHOR_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checkout Website Target Repository
        run: |
          if [[ -n "${TARGET_REPO_PAT}" ]]; then
            echo "Cloning target repo: ${TARGET_REPO_OWNER}/${TARGET_REPO_NAME} branch: ${TARGET_REPO_BRANCH}"
            git clone --branch "${TARGET_REPO_BRANCH}" "https://x-access-token:${TARGET_REPO_PAT}@github.com/${TARGET_REPO_OWNER}/${TARGET_REPO_NAME}.git" website-target
          else
            echo "No external target repo PAT configured; operating locally."
            mkdir -p website-target/apps/web
            if [[ -d "apps/web" ]]; then
              cp -r apps/web website-target/apps/
            fi
          fi

      - name: Scrape Lenovo Outlet Refurb Catalog
        shell: bash
        run: |
          echo "=== Starting Lenovo Outlet Catalog Scrape ==="
          target_data="website-target/apps/web/data-refurb.json"
          if [[ ! -f "${target_data}" && -f "apps/web/data-refurb.json" ]]; then
            target_data="apps/web/data-refurb.json"
          fi
          python -u scripts/catalog.py --provider refurb scrape \
            --output data/refurb-catalog.json \
            --existing-file "${target_data}" \
            --new-ids-output data/refurb-new-ids.json \
            --workers "${WORKERS}" \
            --verbose

      - name: Format Refurb Public Catalog & Apply PSREF Enrichment
        run: |
          echo "=== Formatting Refurb Public Web Catalog ==="
          target_data="website-target/apps/web/data-refurb.json"
          if [[ ! -f "${target_data}" && -f "apps/web/data-refurb.json" ]]; then
            target_data="apps/web/data-refurb.json"
          fi
          python -u scripts/catalog.py --provider refurb format \
            --input data/refurb-catalog.json \
            --output "${target_data}" \
            --existing-data "${target_data}"

      - name: Count new Refurb IDs
        id: new_ids
        run: |
          count=$(python -c 'import json; from pathlib import Path; p=Path("data/refurb-new-ids.json"); print(len(json.loads(p.read_text())) if p.exists() else 0)')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Newly Discovered Refurb SKUs: ${count}"

      - name: Fetch BitBns Price History
        if: steps.new_ids.outputs.count != '0'
        run: |
          echo "=== Fetching BitBns Price History ==="
          target_data="website-target/apps/web/data-refurb.json"
          target_hist="website-target/apps/web/price_history_refurb"
          if [[ ! -f "${target_data}" && -f "apps/web/data-refurb.json" ]]; then
            target_data="apps/web/data-refurb.json"
            target_hist="apps/web/price_history_refurb"
          fi
          python -u scripts/prices.py \
            --data "${target_data}" \
            --history-dir "${target_hist}" \
            bitbns-history \
            --ids-file data/refurb-new-ids.json \
            --only-new \
            --workers 1 \
            --delay 1.5 || true

      - name: Sync Artifacts to Workspace
        run: |
          if [[ -d "website-target/apps/web" ]]; then
            mkdir -p apps/web
            cp -rf website-target/apps/web/data-refurb.json apps/web/ 2>/dev/null || true
            cp -rf website-target/apps/web/archive-refurb.json apps/web/ 2>/dev/null || true
            cp -rf website-target/apps/web/price_history_refurb apps/web/ 2>/dev/null || true
          fi

      - name: Commit and Push Changes
        if: env.COMMIT_CHANGES == 'true'
        run: |
          git config user.name "${GIT_COMMIT_AUTHOR_NAME}"
          git config user.email "${GIT_COMMIT_AUTHOR_EMAIL}"

          git add apps/web/ data/ || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit in local repository."
          else
            git commit -m "Auto-refresh Lenovo Refurb catalog and inventory [skip ci]"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            for attempt in {1..5}; do
              git fetch origin HEAD
              if git rebase FETCH_HEAD; then
                if git push origin HEAD; then
                  echo "Successfully pushed to local repository"
                  break
                fi
              else
                git rebase --abort 2>/dev/null || true
                git merge -X theirs FETCH_HEAD -m "Merge remote changes" 2>/dev/null || true
                if git push origin HEAD; then
                  echo "Successfully pushed to local repository after merge"
                  break
                fi
              fi
              echo "Local push failed; retrying in 3s (attempt ${attempt}/5)..."
              sleep 3
            done
          fi

          if [[ -n "${TARGET_REPO_PAT}" && -d "website-target/.git" ]]; then
            cd website-target
            git config user.name "${GIT_COMMIT_AUTHOR_NAME}"
            git config user.email "${GIT_COMMIT_AUTHOR_EMAIL}"
            git add apps/web/ data/ || true
            if git diff --staged --quiet; then
              echo "No changes to commit in target website repository."
            else
              git commit -m "Auto-refresh Lenovo Refurb catalog and inventory [skip ci]"
              git checkout -- . 2>/dev/null || true
              git clean -fd 2>/dev/null || true
              for attempt in {1..5}; do
                git fetch origin "${TARGET_REPO_BRANCH}"
                if git rebase "origin/${TARGET_REPO_BRANCH}"; then
                  if git push origin "${TARGET_REPO_BRANCH}"; then
                    echo "Successfully pushed changes to target website repository"
                    break
                  fi
                else
                  git rebase --abort 2>/dev/null || true
                  git merge -X theirs "origin/${TARGET_REPO_BRANCH}" -m "Merge remote branch '${TARGET_REPO_BRANCH}'" 2>/dev/null || true
                  if git push origin "${TARGET_REPO_BRANCH}"; then
                    echo "Successfully pushed changes to target website repository after merge"
                    break
                  fi
                fi
                echo "Target website push failed; retrying in 3s (attempt ${attempt}/5)..."
                sleep 3
              done
            fi
          fi
