name: Catalog Hygiene (Scripts Repo)

on:
  schedule:
    - cron: '0 2,10,18 * * *'
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:
    inputs:
      series:
        description: 'Series filters, space separated'
        required: false
        default: 'LOQ ThinkPad Legion IdeaPad ThinkBook Yoga'
      scrape_all:
        description: 'Force refresh all names/specs (Full Scrape)'
        type: boolean
        default: false
      product_ids:
        description: 'Optional SKU list to target, comma/space separated'
        required: false
        default: ''
      commit_changes:
        description: 'Commit and push changes'
        type: boolean
        default: true
      fetch_cto_configs:
        description: 'Refresh CTO configs'
        type: boolean
        default: true
      archive_stale_models:
        description: 'Archive unavailable Lenovo models'
        type: boolean
        default: true
      archive_product_ids:
        description: 'Optional archive-check SKU list'
        required: false
        default: ''
      archive_max:
        description: 'Abort if more products would archive'
        required: false
        default: '100'
      limit_per_series:
        description: 'Optional debug limit per series'
        required: false
        default: ''
      scrape_workers:
        description: 'Parallel PDP detail workers'
        required: false
        default: '8'
      bitbns_workers:
        description: 'BitBns workers for new-listing history seeding'
        required: false
        default: '1'
      bitbns_delay:
        description: 'Seconds to wait before each BitBns request'
        required: false
        default: '5'
      price_workers:
        description: 'Lenovo current-price workers'
        required: false
        default: '6'
      cto_workers:
        description: 'CTO config workers'
        required: false
        default: '4'

permissions:
  contents: write

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'
      TARGET_REPO_OWNER: ${{ secrets.TARGET_REPO_OWNER || 'kryptobolt07' }}
      TARGET_REPO_NAME: ${{ secrets.TARGET_REPO_NAME || 'laptopdeals' }}
      TARGET_REPO_BRANCH: ${{ secrets.TARGET_REPO_BRANCH || 'main' }}
      TARGET_REPO_PAT: ${{ secrets.TARGET_REPO_PAT }}
      SERIES: ${{ github.event.inputs.series || 'LOQ ThinkPad Legion IdeaPad ThinkBook Yoga' }}
      COMMIT_CHANGES: ${{ github.event_name == 'schedule' && 'true' || inputs.commit_changes }}
      FETCH_CTO: ${{ github.event_name == 'schedule' && 'true' || inputs.fetch_cto_configs }}
      ARCHIVE_STALE: ${{ github.event_name == 'schedule' && 'true' || inputs.archive_stale_models }}
      ARCHIVE_PRODUCT_IDS: ${{ github.event.inputs.archive_product_ids || '' }}
      ARCHIVE_MAX: ${{ github.event.inputs.archive_max || '100' }}
      LIMIT_PER_SERIES: ${{ github.event.inputs.limit_per_series || '' }}
      SCRAPE_WORKERS: ${{ github.event.inputs.scrape_workers || '8' }}
      SCRAPE_ALL: ${{ github.event_name == 'schedule' && 'false' || inputs.scrape_all }}
      PRODUCT_IDS: ${{ github.event.inputs.product_ids || '' }}
      BITBNS_WORKERS: ${{ github.event.inputs.bitbns_workers || '1' }}
      BITBNS_DELAY: ${{ github.event.inputs.bitbns_delay || '5' }}
      PRICE_WORKERS: ${{ github.event.inputs.price_workers || '6' }}
      CTO_WORKERS: ${{ github.event.inputs.cto_workers || '4' }}

      GIT_COMMIT_AUTHOR_NAME: ${{ secrets.GIT_COMMIT_AUTHOR_NAME || 'github-actions[bot]' }}
      GIT_COMMIT_AUTHOR_EMAIL: ${{ secrets.GIT_COMMIT_AUTHOR_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checkout Website Target Repository
        run: |
          echo "Cloning target repo: ${TARGET_REPO_OWNER}/${TARGET_REPO_NAME} branch: ${TARGET_REPO_BRANCH}"
          git clone --branch "${TARGET_REPO_BRANCH}" "https://x-access-token:${TARGET_REPO_PAT}@github.com/${TARGET_REPO_OWNER}/${TARGET_REPO_NAME}.git" website-target
          if [[ ! -f "website-target/apps/web/data.json" ]]; then
            echo "::error::Target website repository file website-target/apps/web/data.json not found! Please verify TARGET_REPO_PAT, TARGET_REPO_OWNER, and TARGET_REPO_NAME secrets."
            exit 1
          fi

      - name: Scrape Lenovo listings
        shell: bash
        run: |
          echo "=== Starting Lenovo Catalog Scrape ==="
          only_new_arg='--only-new'
          if [[ "${SCRAPE_ALL}" == 'true' || -n "${PRODUCT_IDS}" ]]; then
            only_new_arg=''
          fi
          args=(scrape --output data/lenovo-catalog.json ${only_new_arg} --existing-file website-target/apps/web/data.json --new-ids-output data/lenovo-new-ids.json --workers "${SCRAPE_WORKERS}" --verbose)
          
          # Add product ID targets if specified
          ids="${PRODUCT_IDS//,/ }"
          for pid in ${ids}; do
            args+=(--id "$pid")
          done
          
          if [[ -n "${LIMIT_PER_SERIES}" ]]; then
            args+=(--limit-per-series "${LIMIT_PER_SERIES}")
          fi
          args+=(--series)
          for item in ${SERIES}; do
            args+=("${item}")
          done
          python -u scripts/catalog.py "${args[@]}"

      - name: Restore reappeared archive entries
        run: |
          echo "=== Restoring reappeared archive entries ==="
          python -u scripts/archive.py restore --raw-catalog data/lenovo-catalog.json --ids-file data/lenovo-new-ids.json --data website-target/apps/web/data.json --archive website-target/apps/web/archive.json --apply

      - name: Archive stale Lenovo models
        if: github.event_name == 'schedule' || env.ARCHIVE_STALE == 'true'
        shell: bash
        run: |
          echo "=== Archive Check for Unavailable Models ==="
          args=(check --apply --max-archive "${ARCHIVE_MAX}" --data website-target/apps/web/data.json --archive website-target/apps/web/archive.json --raw-catalog data/lenovo-catalog.json)
          ids="${ARCHIVE_PRODUCT_IDS//,/ }"
          for product_id in ${ids}; do
            args+=(--id "${product_id}")
          done
          python -u scripts/archive.py "${args[@]}"

      - name: Count new Lenovo IDs
        id: new_ids
        run: |
          count=$(python -c 'import json; from pathlib import Path; p=Path("data/lenovo-new-ids.json"); print(len(json.loads(p.read_text())) if p.exists() else 0)')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Newly Discovered Lenovo SKUs: ${count}"

      - name: BitBns primary history for new listings
        if: steps.new_ids.outputs.count != '0'
        run: |
          echo "=== Seeding BitBns History for New Listings ==="
          python -u scripts/prices.py \
            --data website-target/apps/web/data.json \
            --history-dir website-target/apps/web/price_history \
            bitbns-history \
            --ids-file data/lenovo-new-ids.json \
            --only-new \
            --workers "${BITBNS_WORKERS}" \
            --delay "${BITBNS_DELAY}" \
            --failed-ids-output data/bitbns-missing-ids.json

      - name: Refresh CTO configs
        if: env.FETCH_CTO == 'true'
        run: |
          echo "=== Refreshing Lenovo CTO Options ==="
          python -u scripts/cto.py --data website-target/apps/web/data.json --raw-catalog data/lenovo-catalog.json --output-dir website-target/apps/web/cto_configs --workers "${CTO_WORKERS}"


      - name: Build PSREF specs
        shell: bash
        run: |
          echo "=== Building PSREF Sidecar Specs ==="
          id_count=$(python -c 'import json; from pathlib import Path; p=Path("data/lenovo-new-ids.json"); print(len(json.loads(p.read_text())) if p.exists() else 0)')
          if [[ "${SCRAPE_ALL}" == 'true' ]]; then
            python -u scripts/psref.py --verbose
          elif [[ "${id_count}" -gt 0 ]]; then
            python -u scripts/psref.py --ids-file data/lenovo-new-ids.json --verbose
          else
            echo "No new Lenovo IDs to build PSREF specs for; skipping (existing sidecar preserved)."
          fi

      - name: Rebuild public catalog
        run: |
          echo "=== Rebuilding Public Web Catalog ==="
          python -u scripts/catalog.py format \
            --input data/lenovo-catalog.json \
            --output website-target/apps/web/data.json \
            --existing-data website-target/apps/web/data.json \
            --history-dir website-target/apps/web/price_history \
            --cto-dir website-target/apps/web/cto_configs \
            --psref-map website-target/data/lenovo_psref/final_sku_specs.json \
            --psref-dir website-target/data/lenovo_psref/by_sku

      - name: Re-enrich CTO specs
        if: env.FETCH_CTO == 'true'
        run: |
          echo "=== Re-enriching CTO Specs ==="
          python -u scripts/cto.py --data website-target/apps/web/data.json --output-dir website-target/apps/web/cto_configs --reenrich --force

      - name: Normalize hardware specs from inventory
        run: |
          echo "=== Normalizing Hardware Specs from Inventory ==="
          python -u scripts/normalize.py


      - name: Refresh current prices after catalog rebuild
        run: |
          echo "=== Refreshing Live Lenovo Current Prices ==="
          python -u scripts/prices.py --data website-target/apps/web/data.json --history-dir website-target/apps/web/price_history lenovo-current --workers "${PRICE_WORKERS}"

      - name: Recalculate stats and inventory
        run: |
          echo "=== Recalculating Statistics & Exporting Filter Inventory ==="
          python -u scripts/prices.py --data website-target/apps/web/data.json --history-dir website-target/apps/web/price_history stats
          python -u scripts/maintenance.py inventory --input website-target/apps/web/data.json --output website-target/data/spec_inventory.json

      - name: Commit and Push Changes to Target Website Repo
        if: env.COMMIT_CHANGES == 'true'
        working-directory: website-target
        run: |
          echo "=== Checking Git Diff and Committing to Target Website Repository ==="
          git config user.email "${GIT_COMMIT_AUTHOR_EMAIL}"
          git config user.name "${GIT_COMMIT_AUTHOR_NAME}"
          git add apps/web/ data/ || true
          git status
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Catalog hygiene - $(date +'%Y-%m-%d %H:%M:%S IST')"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            for attempt in {1..5}; do
              git fetch origin "${TARGET_REPO_BRANCH}"
              if git rebase "origin/${TARGET_REPO_BRANCH}"; then
                if git push origin "${TARGET_REPO_BRANCH}"; then
                  echo "Successfully pushed changes to ${TARGET_REPO_OWNER}/${TARGET_REPO_NAME} branch ${TARGET_REPO_BRANCH}"
                  break
                fi
              else
                echo "Rebase conflict or failure, aborting rebase and merging remote changes..."
                git rebase --abort 2>/dev/null || true
                git merge -X theirs "origin/${TARGET_REPO_BRANCH}" -m "Merge remote branch '${TARGET_REPO_BRANCH}'" 2>/dev/null || true
                if git push origin "${TARGET_REPO_BRANCH}"; then
                  echo "Successfully pushed changes after merge resolution"
                  break
                fi
              fi
              echo "Push failed or conflicted; retrying in 3s (attempt ${attempt}/5)..."
              sleep 3
            done
          else
            echo "No changes detected. Skipping push."
          fi
